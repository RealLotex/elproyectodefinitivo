<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>El Proyecto Definitivo</title>
  <link rel="stylesheet" href="style.css?v=5" />
</head>
<body>
  <main class="stage-shell">
    <div id="stage" class="stage">
      <canvas id="game" width="854" height="480" aria-label="RPG 2D"></canvas>

      <form id="nameEntry" class="terminal-entry hidden" autocomplete="off" onkeydown="event.stopPropagation()">
        <div>NOMBRE DEL RESIDENTE:</div>
        <div class="terminal-row">
          <span>&gt;</span>
          <input id="residentName" maxlength="12" spellcheck="false" />
          <span class="caret">_</span>
        </div>
        <div class="terminal-help">ENTER — CONFIRMAR</div>
      </form>
    </div>

    <div class="underbar">
      <span>WASD / FLECHAS · E / ENTER</span>
      <button id="resetBtn" type="button">NUEVA PARTIDA</button>
    </div>
  </main>

  <script src="game.js?v=5"></script>
  <script src="selection-fix.js?v=5"></script>
  <script src="character-style.js?v=5"></script>
  <script src="layout-854.js?v=5"></script>
</body>
</html>
